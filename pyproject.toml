[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayback-recon"
version = "0.2.0"
description = "Passive OSINT reconnaissance tool that discovers historical URLs from the Wayback Machine CDX API and flags interesting attack surfaces."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
]
keywords = ["osint", "recon", "pentest", "wayback", "cdx", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
wayback-recon = "wayback_recon.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["wayback_recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]